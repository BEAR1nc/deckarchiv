name: Probe neue Shops
on:
  push:
    branches: [main]
    paths: ["scraper/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scraper/probe.py
      - run: |
          git config user.name "deckarchiv-bot"; git config user.email "deckarchiv-bot@users.noreply.github.com"
          git add probe; git commit -m "Probe-Ergebnisse" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
